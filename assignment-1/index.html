        <body>
            <header>
                    <h1>please input information for order</h1>
            </header>
             <main>
                <form id="Papyruspizza" action="info-pizza.php" method="get">

                    <fieldset>
                    <legend><em>pizza order information</em></legend>
                        <div>
                        <label for="name">name for the order</label>
                        <input  type="text" id="fname"  name="fname" />
                        <input  type="text" id="lname"  name="lname" />
                        </div>

                        <p></p>

                        <div>
                        <label for="nop">number of pizzas</label>
                        <input type="text" id="nop"  name="nop" />
                        </div>

                        <p></p>

                        <div>
                        <label for="crust">crust</label>
                        <select name="crusttype">
                            <option value="regular">regular</option>
                            <option value="thin">thin</option>
                            <option value="deep dish">deep dish</option>
                            <option value="stuffed">stuffed crust</option>
                        </select>
                        </div>

                        <p></p>

                        <div>
                        <label for="shape">shape</label>
                        <select name="shape">
                            <option value="round">round</option>
                            <option value="square">square</option>
                        </select>
                        </div>

                        <p></p>

                        <div>
                        <label for="size">size</label>
                        <select name="size">
                            <option value="small(6 slices)">small(6 slices)</option>
                            <option value="medium(8 slices)">medium(8 slices)</option>
                            <option value="large(10 slices)">large(10 slices)</option>
                            </select>
                        </div>
                        <!--the blank <p> are used for spaces-->
                        <p></p>

                        <div>
                            <label for="toppings1">toppings</label>
                            <select name="topping1" id="topping1">
                                <option value="none">none</option>
                                <option value="extra cheese">extra cheese</option>
                                <option value="pepparoni">pepparoni</option>
                                <option value="olives">olives</option>
                                <option value="mushrooms">mushrooms</option>
                                <option value="green onions">green onions</option>
                                <option value="pineapple">pineapple</option>
                            </select>
                            <select name="topping2" id="topping">
                                <option value="none">none</option>
                                <option value="extra cheese">extra cheese</option>
                                <option value="pepparoni">pepparoni</option>
                                <option value="olives">olives</option>
                                <option value="mushrooms">mushrooms</option>
                                <option value="green onions">green onions</option>
                                <option value="pineapple">pineapple</option>
                            </select>
                            <select name="topping" id="topping">
                                <option value="none">none</option>
                                <option value="extra cheese">extra cheese</option>
                                <option value="pepparoni">pepparoni</option>
                                <option value="olives">olives</option>
                                <option value="mushrooms">mushrooms</option>
                                <option value="green onions">green onions</option>
                                <option value="pineapple">pineapple</option>
                            </select>
                        </div>

                        <p></p>

                        <div>
                        <input type="radio" name="mfa" id="out" value="out" />
                        <label for="take out">take out</label>
                   
                        <input type="radio" name="mfa" id="in" value="in" />
                        <label for="eat in">eat in</label>
                    
                        <input type="radio" name="mfa" id="delivery" value="delivery" />
                        <label for="delivery">delivery</label>
                        </div>

                        <p></p>

                        <div>
                        <label for="address">Address(delivery only)</label>
                        <input type="text" id="address"  name="address" />
                        </div>

                        <p></p>

                        <div>
                        <label for="Phonenumber">Phone number</label>
                        <input type="text" id="Phone-number"  name="Phone-number" />
                        </div>

                 <button type ="reset">Reset</button> <button type="submit">submit</button>
